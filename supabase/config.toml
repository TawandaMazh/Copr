# Minimal Supabase CLI config for local / linked projects.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "copr"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://copr-phi.vercel.app"
additional_redirect_urls = [
  "https://copr-phi.vercel.app/**",
  "http://localhost:3000/**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your copr sign-in code"
content = """<h2>Your copr sign-in code</h2>
<p>Enter this 6-digit code on the copr sign-in screen:</p>
<p style="font-size:28px;letter-spacing:0.25em;font-weight:700">{{ .Token }}</p>
<p style="color:#666;font-size:14px">This code expires shortly. If you didn’t request it, you can ignore this email.</p>"""

[auth.sms]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
